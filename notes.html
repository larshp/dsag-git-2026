<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaker notes</title>

    <!-- Slide previews are rendered with the deck's own styles. -->
    <link rel="stylesheet" href="css/deck.css" />
    <link rel="stylesheet" href="css/custom.css" />

    <style>
      body {
        margin: 0;
        padding: 18px;
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: #eef1f4;
        color: #1d2d3e;
        font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 22px;
      }

      .timer {
        font: 600 40px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        user-select: none;
      }

      .timer:hover {
        color: #0a6ed1;
      }

      .clock,
      .position {
        color: #5b6b7b;
        font-variant-numeric: tabular-nums;
      }

      .position {
        margin-left: auto;
        font-weight: 600;
        color: #1d2d3e;
      }

      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1.55fr 1fr;
        gap: 16px;
        min-height: 0;
      }

      .pane {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 0;
      }

      .pane > h2 {
        margin: 0;
        font: 600 11px/1 "Segoe UI", system-ui, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #93a1af;
      }

      .preview {
        position: relative;
        overflow: hidden;
        aspect-ratio: 1280 / 720;
        border: 1px solid #d7dee5;
        border-radius: 6px;
        background: #fff;
      }

      /* Un-anchor the stage from deck.css and shrink it into the box. */
      .preview .deck-slides {
        position: absolute;
        left: 0;
        top: 0;
        margin: 0;
        transform-origin: 0 0;
        transform: scale(var(--preview-scale, 0.3));
      }

      .preview.is-empty::after {
        content: "end of deck";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #93a1af;
      }

      .notes-body {
        flex: 1;
        overflow: auto;
        padding: 14px 16px;
        border: 1px solid #d7dee5;
        border-radius: 6px;
        background: #fff;
        font-size: 17px;
      }

      .notes-body:empty::after {
        content: "No notes for this slide.";
        color: #93a1af;
      }

      .notes-body p {
        margin: 0 0 0.7em;
      }

      .notes-body code {
        padding: 1px 5px;
        border-radius: 3px;
        background: #f0f3f6;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 0.9em;
      }

      footer {
        color: #93a1af;
        font-size: 12px;
      }

      .disconnected {
        display: none;
        padding: 14px 16px;
        border-radius: 6px;
        background: #fdf1e3;
        color: #8a5a12;
      }

      body.is-disconnected .disconnected {
        display: block;
      }

      body.is-disconnected main,
      body.is-disconnected header {
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <p class="disconnected">
      Not connected to a deck. Open the slides and press <b>s</b>.
    </p>

    <header>
      <span class="timer" id="timer" title="Click to reset">00:00</span>
      <span class="clock" id="clock"></span>
      <span class="position" id="position"></span>
    </header>

    <main>
      <div class="pane">
        <h2>Current</h2>
        <div class="preview" id="current-preview"></div>
      </div>

      <div class="pane">
        <h2>Next</h2>
        <div class="preview" id="next-preview"></div>
        <h2>Notes</h2>
        <div class="notes-body" id="notes"></div>
      </div>
    </main>

    <footer>
      Arrow keys, space and <b>b</b> / <b>f</b> control the deck from this
      window. Click the timer to reset it.
    </footer>

    <script>
      (function () {
        "use strict";

        var deck = window.opener;
        var previews = {
          current: document.getElementById("current-preview"),
          next: document.getElementById("next-preview"),
        };
        var notesEl = document.getElementById("notes");
        var positionEl = document.getElementById("position");
        var timerEl = document.getElementById("timer");
        var clockEl = document.getElementById("clock");
        var startedAt = Date.now();

        function pad(value) {
          return String(value).padStart(2, "0");
        }

        function tick() {
          var seconds = Math.floor((Date.now() - startedAt) / 1000);
          var hours = Math.floor(seconds / 3600);
          timerEl.textContent =
            (hours ? hours + ":" : "") +
            pad(Math.floor(seconds / 60) % 60) +
            ":" +
            pad(seconds % 60);
          clockEl.textContent = new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
        }

        function fitPreviews() {
          Object.keys(previews).forEach(function (name) {
            var box = previews[name];
            box.style.setProperty("--preview-scale", box.clientWidth / 1280);
          });
        }

        function renderPreview(box, html) {
          box.classList.toggle("is-empty", !html);
          box.innerHTML = html
            ? '<div class="deck-slides">' + html + "</div>"
            : "";
        }

        function apply(state) {
          renderPreview(previews.current, state.current);
          renderPreview(previews.next, state.next);
          notesEl.innerHTML = state.notes || "";
          positionEl.textContent =
            state.index +
            " / " +
            state.total +
            (state.stack ? "  ·  " + state.stack : "");
          fitPreviews();
        }

        window.addEventListener("message", function (event) {
          if (event.source !== deck) return;
          var data = event.data;
          if (data && data.type === "deck-state") apply(data);
        });

        window.addEventListener("resize", fitPreviews);

        timerEl.addEventListener("click", function () {
          startedAt = Date.now();
          tick();
        });

        document.addEventListener("keydown", function (event) {
          if (!deck || deck.closed) return;
          if (event.ctrlKey || event.metaKey || event.altKey) return;
          deck.postMessage(
            {
              type: "deck-notes-key",
              key: event.key,
              shiftKey: event.shiftKey,
            },
            "*"
          );
          if (
            event.key === " " ||
            event.key.indexOf("Arrow") === 0 ||
            event.key === "PageUp" ||
            event.key === "PageDown"
          ) {
            event.preventDefault();
          }
        });

        setInterval(tick, 500);
        tick();

        if (deck && !deck.closed) {
          deck.postMessage({ type: "deck-notes-ready" }, "*");
        } else {
          document.body.classList.add("is-disconnected");
        }
      })();
    </script>
  </body>
</html>
