    <text x="613" y="707">Diff</text>
    <text x="613" y="744">Diff</text>
  </g>

  <!-- ============================= scrollbars ============================= -->

  <!-- HTML viewer -->
  <rect x="1308" y="140" width="21" height="640" fill="#f6f6f6" stroke="#e2e2e2"/>
  <rect x="1311" y="618" width="15" height="34" rx="2" fill="#c9c9c9"/>
  <!-- SAP container, arrows at both ends -->
  <rect x="1330" y="140" width="22" height="640" fill="#eef0f2" stroke="#d7dbe0"/>
  <g fill="#5a6672">
    <path d="M1341 146l6 8h-12z"/>
    <path d="M1341 172l-6-8h12z"/>
    <path d="M1341 748l6 8h-12z"/>
    <path d="M1341 774l-6-8h12z"/>
  </g>
  <rect x="1333" y="336" width="16" height="42" rx="2" fill="#c4cbd2"/>

  <!-- =============================== footer =============================== -->

